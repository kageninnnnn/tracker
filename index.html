<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Capital</title>
  <style>
    :root {
      --bg: #000000; --surface: #1c1c1e; --separator: #38383a;
      --blue: #0a84ff; --red: #ff453a; --green: #32d74b; --purple: #bf5af2;
      --text: #ffffff; --text-sec: #8e8e93;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px 80px; }
    
    /* Сводка (Стиль Apple Card) */
    .hero-card { background: var(--surface); border-radius: 20px; padding: 20px; margin-bottom: 24px; }
    .hero-label { font-size: 13px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; margin-bottom: 4px; }
    .hero-balance { font-size: 40px; font-weight: 700; color: #fff; margin-bottom: 20px; letter-spacing: -1px; }
    .hero-stats { display: flex; justify-content: space-between; border-top: 1px solid var(--separator); padding-top: 16px; gap: 8px; }
    .stat-box { flex: 1; }
    .stat-label { font-size: 12px; color: var(--text-sec); margin-bottom: 4px; }
    .stat-val { font-size: 16px; font-weight: 600; }
    .val-exp { color: var(--red); } .val-dep { color: var(--blue); } .val-inc { color: var(--green); }

    /* Сегментированный контроль iOS */
    .segmented-control { display: flex; background: #1c1c1e; padding: 3px; border-radius: 9px; margin-bottom: 16px; }
    .seg-btn { flex: 1; padding: 6px 0; border: none; background: transparent; color: var(--text); font-size: 13px; font-weight: 600; border-radius: 7px; transition: 0.2s; cursor: pointer; }
    .seg-btn.active { background: #636366; color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04); }

    /* Формы ввода (iOS Inset Grouped) */
    .ios-group { background: var(--surface); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
    .ios-row { display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--separator); position: relative; }
    .ios-row:last-child { border-bottom: none; }
    .ios-row input, .ios-row select { width: 100%; background: transparent; border: none; color: var(--text); padding: 14px 0; font-size: 17px; outline: none; appearance: none; }
    .ios-row input::placeholder { color: var(--text-sec); }
    .ios-row input[type="date"] { color-scheme: dark; }
    
    button.submit { width: 100%; padding: 16px; background: var(--blue); color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; margin-bottom: 24px; cursor: pointer; }
    button.submit:active { opacity: 0.8; }

    /* Заголовки секций и фильтры */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
    .section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .filter-controls { display: flex; align-items: center; gap: 8px; }
    select#month-filter, input#date-filter { background: var(--surface); color: var(--blue); border: none; font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 8px; outline: none; color-scheme: dark; }

    /* Аналитика (Прогресс-бары) */
    .analytics-list { background: var(--surface); border-radius: 12px; padding: 12px 16px; margin-bottom: 24px; }
    .analytics-item { margin-bottom: 12px; }
    .analytics-item:last-child { margin-bottom: 0; }
    .analytics-info { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
    .analytics-cat { font-weight: 500; }
    .analytics-amt { color: var(--text-sec); }
    .progress-track { width: 100%; height: 6px; background: var(--separator); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--blue); border-radius: 3px; }

    /* Лента истории */
    .day-group { margin-bottom: 20px; }
    .day-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; margin-bottom: 8px; padding: 0 16px; }
    .history-list { background: var(--surface); border-radius: 12px; overflow: hidden; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--separator); }
    .history-item:last-child { border-bottom: none; }
    .item-cat { font-size: 17px; font-weight: 500; }
    .item-desc { font-size: 13px; color: var(--text-sec); margin-top: 2px; }
    .item-amt { font-size: 17px; font-weight: 600; text-align: right; }
    .amt-exp { color: var(--text); } .amt-inc { color: var(--green); } .amt-dep { color: var(--blue); }
    .del-btn { color: var(--red); background: transparent; border: none; font-size: 15px; padding-left: 12px; margin-left: 12px; border-left: 1px solid var(--separator); cursor: pointer; }

    .data-tools { display: flex; gap: 10px; margin-top: 30px; }
    .tool-btn { flex: 1; padding: 10px; border-radius: 10px; background: var(--surface); color: var(--blue); border: none; font-size: 13px; font-weight: 500; cursor: pointer; }
    .empty-notice { color: var(--text-sec); font-size: 14px; text-align: center; padding: 20px; background: var(--surface); border-radius: 12px; }
  </style>
</head>
<body>

  <!-- Карточка глобального капитала и сводки по выбранному месяцу -->
  <div class="hero-card">
    <div class="hero-label">Мой капитал</div>
    <div id="val-balance" class="hero-balance">0 ₸</div>
    <div class="hero-stats">
      <div class="stat-box">
        <div class="stat-label">Доход (мес)</div>
        <div id="val-month-inc" class="stat-val val-inc">0 ₸</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Расход (мес)</div>
        <div id="val-month-exp" class="stat-val val-exp">0 ₸</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">В копилке</div>
        <div id="val-deposit" class="stat-val val-dep">0 ₸</div>
      </div>
    </div>
  </div>

  <!-- Форма добавления операции -->
  <div>
    <div class="segmented-control">
      <button class="seg-btn active" onclick="setType('exp')" id="btn-exp">Расход</button>
      <button class="seg-btn" onclick="setType('inc')" id="btn-inc">Доход</button>
      <button class="seg-btn" onclick="setType('dep')" id="btn-dep">Копилка</button>
    </div>
    <div class="ios-group">
      <div class="ios-row"><input type="number" id="amount" placeholder="Сумма (₸)" inputmode="numeric"></div>
      <div class="ios-row"><select id="category"></select></div>
      <div class="ios-row"><input type="date" id="entry-date"></div>
      <div class="ios-row"><input type="text" id="note" placeholder="Заметка"></div>
    </div>
    <button class="submit" onclick="addEntry()">Добавить</button>
  </div>

  <!-- Аналитика по месяцам -->
  <div class="section-header">
    <div class="section-title">Аналитика</div>
    <select id="month-filter" onchange="render()"></select>
  </div>
  <div id="analytics" class="analytics-list"></div>

  <!-- История с фильтрацией: весь месяц или конкретный день -->
  <div class="section-header" style="margin-top: 24px;">
    <div class="section-title">История</div>
    <div class="filter-controls">
      <input type="date" id="date-filter" onchange="applyDateFilter()" style="display: none;">
    </div>
  </div>

  <div class="segmented-control" style="margin-bottom: 12px;">
    <button class="seg-btn active" id="filter-mode-month" onclick="setViewMode('month')">За весь месяц</button>
    <button class="seg-btn" id="filter-mode-day" onclick="setViewMode('day')">По дате</button>
  </div>

  <div id="list"></div>

  <!-- Инструменты импорта/экспорта -->
  <div class="data-tools">
    <button class="tool-btn" onclick="exportData()">Скачать JSON</button>
    <button class="tool-btn" onclick="document.getElementById('import-file').click()">Загрузить JSON</button>
    <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
  </div>

  <script>
    let entries = JSON.parse(localStorage.getItem('mm_data') || '[]');
    let currentType = 'exp';
    let viewMode = 'month'; // 'month' или 'day'

    const categories = {
      exp: ['Еда / Продукты', 'Зал / БАДы', 'Долги', 'Вещи / Техника', 'Транспорт', 'Хотелки'],
      inc: ['Зарплата', 'Перевод', 'Подарок'],
      dep: ['Пополнение', 'Снятие из копилки']
    };

    // Установка даты по умолчанию в форму (сегодняшний день)
    document.getElementById('entry-date').value = new Date().toISOString().substring(0, 10);
    document.getElementById('date-filter').value = new Date().toISOString().substring(0, 10);

    function setType(type) {
      currentType = type;
      document.querySelectorAll('.segmented-control:first-of-type .seg-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${type}`).classList.add('active');
      document.getElementById('category').innerHTML = categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('filter-mode-month').classList.toggle('active', mode === 'month');
      document.getElementById('filter-mode-day').classList.toggle('active', mode === 'day');
      document.getElementById('date-filter').style.display = mode === 'day' ? 'block' : 'none';
      render();
    }

    function applyDateFilter() {
      // Автоматически переключаем фильтр месяца на месяц выбранной даты
      const selectedDate = document.getElementById('date-filter').value;
      if (selectedDate) {
        const monthPart = selectedDate.substring(0, 7);
        const monthSelect = document.getElementById('month-filter');
        if (monthSelect.value !== monthPart) {
          monthSelect.value = monthPart;
        }
      }
      render();
    }

    function updateMonthFilter() {
      const select = document.getElementById('month-filter');
      const months = [...new Set(entries.map(e => e.date.substring(0, 7)))].sort().reverse();
      const current = new Date().toISOString().substring(0, 7);
      if (!months.includes(current)) months.unshift(current);
      
      const prevVal = select.value;
      select.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
      if (months.includes(prevVal)) {
        select.value = prevVal;
      } else {
        select.value = current;
      }
    }

    function render() {
      updateMonthFilter();
      const listEl = document.getElementById('list');
      const analyticsEl = document.getElementById('analytics');
      listEl.innerHTML = ''; 
      analyticsEl.innerHTML = '';
      
      let totalInc = 0, totalExp = 0, totalDep = 0;
      let monthInc = 0, monthExp = 0;
      
      const selectedMonth = document.getElementById('month-filter').value;
      const selectedDay = document.getElementById('date-filter').value;
      
      const groups = {};
      const categorySums = {};

      entries.forEach(item => {
        const itemDateStr = item.date.substring(0, 10);
        const itemMonth = item.date.substring(0, 7);

        // Расчет глобального капитала
        if (item.type === 'inc') totalInc += item.amount;
        if (item.type === 'exp') totalExp += item.amount;
        if (item.type === 'dep') {
          if (item.category === 'Снятие из копилки') totalDep -= item.amount;
          else totalDep += item.amount;
        }

        // Расчет сводки выбранного месяца
        if (itemMonth === selectedMonth) {
          if (item.type === 'inc') monthInc += item.amount;
          if (item.type === 'exp') {
            monthExp += item.amount;
            categorySums[item.category] = (categorySums[item.category] || 0) + item.amount;
          }
        }

        // Проверка вхождения в текущий режим отображения истории
        let matchesFilter = false;
        if (viewMode === 'month' && itemMonth === selectedMonth) {
          matchesFilter = true;
        } else if (viewMode === 'day' && itemDateStr === selectedDay) {
          matchesFilter = true;
        }

        if (matchesFilter) {
          const d = new Date(item.date);
          const dateKey = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
          if (!groups[dateKey]) groups[dateKey] = [];
          groups[dateKey].push(item);
        }
      });

      // Обновление цифр на карточке
      document.getElementById('val-balance').innerText = (totalInc - totalExp - totalDep).toLocaleString() + ' ₸';
      document.getElementById('val-month-inc').innerText = monthInc.toLocaleString() + ' ₸';
      document.getElementById('val-month-exp').innerText = monthExp.toLocaleString() + ' ₸';
      document.getElementById('val-deposit').innerText = totalDep.toLocaleString() + ' ₸';

      // Отрисовка секции "Аналитика расходов" за месяц
      const sortedCats = Object.keys(categorySums).sort((a, b) => categorySums[b] - categorySums[a]);
      if (sortedCats.length === 0) {
        analyticsEl.innerHTML = '<div style="color:var(--text-sec); font-size:14px; text-align:center;">Нет расходов за выбранный месяц</div>';
      } else {
        sortedCats.forEach(cat => {
          const amt = categorySums[cat];
          const percent = monthExp > 0 ? Math.round((amt / monthExp) * 100) : 0;
          analyticsEl.innerHTML += `
            <div class="analytics-item">
              <div class="analytics-info"><span class="analytics-cat">${cat}</span><span class="analytics-amt">${amt.toLocaleString()} ₸ (${percent}%)</span></div>
              <div class="progress-track"><div class="progress-fill" style="width: ${percent}%;"></div></div>
            </div>
          `;
        });
      }

      // Отрисовка истории
      const groupDates = Object.keys(groups);
      if (groupDates.length === 0) {
        listEl.innerHTML = `<div class="empty-notice">${viewMode === 'month' ? 'Нет записей за этот месяц' : 'Нет записей за выбранную дату'}</div>`;
      } else {
        groupDates.forEach(date => {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'day-group';

          // Считаем итог расходов по данному дню
          const dayExp = groups[date]
            .filter(i => i.type === 'exp')
            .reduce((sum, i) => sum + i.amount, 0);

          groupDiv.innerHTML = `
            <div class="day-header">
              <span>${date}</span>
              <span>${dayExp > 0 ? '-' + dayExp.toLocaleString() + ' ₸' : ''}</span>
            </div>
            <div class="history-list"></div>
          `;
          const hList = groupDiv.querySelector('.history-list');
          
          groups[date].slice().reverse().forEach(item => {
            let prefix = '', amtClass = '';
            if (item.type === 'inc' || (item.type === 'dep' && item.category === 'Снятие из копилки')) { 
              prefix = '+'; amtClass = 'amt-inc'; 
            } else if (item.type === 'exp') { 
              prefix = '-'; amtClass = 'amt-exp'; 
            } else { 
              prefix = ''; amtClass = 'amt-dep'; 
            }

            hList.innerHTML += `
              <div class="history-item">
                <div>
                  <div class="item-cat">${item.category}</div>
                  ${item.note ? `<div class="item-desc">${item.note}</div>` : ''}
                </div>
                <div style="display:flex; align-items:center;">
                  <div class="item-amt ${amtClass}">${prefix}${item.amount.toLocaleString()} ₸</div>
                  <button class="del-btn" onclick="deleteEntry(${item.id})">Удалить</button>
                </div>
              </div>
            `;
          });
          listEl.appendChild(groupDiv);
        });
      }

      localStorage.setItem('mm_data', JSON.stringify(entries));
    }

    function addEntry() {
      const amt = parseFloat(document.getElementById('amount').value);
      const selectedDate = document.getElementById('entry-date').value;
      if (!amt || amt <= 0) return;

      // Если дата не заполнена пользователем, берем текущий момент
      const recordDate = selectedDate ? new Date(selectedDate + 'T12:00:00').toISOString() : new Date().toISOString();

      entries.push({ 
        id: Date.now(), 
        type: currentType, 
        amount: amt, 
        category: document.getElementById('category').value, 
        note: document.getElementById('note').value, 
        date: recordDate 
      });

      document.getElementById('amount').value = ''; 
      document.getElementById('note').value = '';
      
      // Сортировка записей хронологически
      entries.sort((a, b) => new Date(a.date) - new Date(b.date));
      render();
    }

    function deleteEntry(id) { 
      if(confirm('Удалить операцию?')) { 
        entries = entries.filter(e => e.id !== id); 
        render(); 
      } 
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); 
      a.href = URL.createObjectURL(blob); 
      a.download = `capital_backup_${new Date().toISOString().substring(0,10)}.json`; 
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0]; 
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => { 
        try { 
          entries = JSON.parse(event.target.result); 
          entries.sort((a, b) => new Date(a.date) - new Date(b.date));
          render(); 
          alert('База загружена!'); 
        } catch (err) { 
          alert('Ошибка чтения файла'); 
        } 
      };
      reader.readAsText(file);
    }

    setType('exp'); 
    render();
  </script>
</body>
</html>
