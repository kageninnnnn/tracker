<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Finance Tracker</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
      --accent: #38bdf8; --red: #f87171; --green: #4ade80;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; gap: 16px;
    }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .stat-card {
      background: var(--card); padding: 14px; border-radius: 12px;
    }
    .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .stat-val { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .income { color: var(--green); }
    .expense { color: var(--red); }
    
    .form-box {
      background: var(--card); padding: 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    input, select, button {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: var(--text); font-size: 16px;
    }
    button {
      background: var(--accent); color: #0f172a; font-weight: 700; border: none; margin-top: 6px;
    }
    button:active { opacity: 0.8; }
    
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      background: var(--card); padding: 12px 16px; border-radius: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .item-cat { font-size: 14px; color: #94a3b8; }
    .item-amt { font-weight: 700; font-size: 16px; }
  </style>
</head>
<body>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Доход</div>
      <div id="total-inc" class="stat-val income">0 ₸</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Расход</div>
      <div id="total-exp" class="stat-val expense">0 ₸</div>
    </div>
  </div>

  <div class="form-box">
    <select id="type">
      <option value="expense">Расход (-)</option>
      <option value="income">Доход (+)</option>
    </select>
    <input type="number" id="amount" placeholder="Сумма (₸)" inputmode="numeric">
    <select id="category">
      <option value="Еда">Еда</option>
      <option value="Зал / БАДы">Зал / БАДы</option>
      <option value="Долги">Долги</option>
      <option value="Вещи / Инструменты">Вещи / Инструменты</option>
      <option value="Хотелки">Хотелки</option>
      <option value="Зарплата / Перевод">Зарплата / Перевод</option>
    </select>
    <button onclick="addEntry()">Записать</button>
  </div>

  <div id="entries-list" class="list"></div>

  <script>
    let entries = JSON.parse(localStorage.getItem('finances') || '[]');

    function render() {
      const list = document.getElementById('entries-list');
      list.innerHTML = '';
      let inc = 0, exp = 0;

      entries.slice().reverse().forEach((item, index) => {
        if (item.type === 'income') inc += item.amount;
        else exp += item.amount;

        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `
          <div>
            <div style="font-weight:600">${item.category}</div>
            <div class="item-cat">${new Date(item.date).toLocaleDateString('ru-RU')}</div>
          </div>
          <div class="item-amt ${item.type === 'income' ? 'income' : 'expense'}">
            ${item.type === 'income' ? '+' : '-'}${item.amount.toLocaleString()} ₸
          </div>
        `;
        list.appendChild(row);
      });

      document.getElementById('total-inc').innerText = inc.toLocaleString() + ' ₸';
      document.getElementById('total-exp').innerText = exp.toLocaleString() + ' ₸';
      localStorage.setItem('finances', JSON.stringify(entries));
    }

    function addEntry() {
      const amtInput = document.getElementById('amount');
      const amount = parseFloat(amtInput.value);
      if (!amount || amount <= 0) return;

      entries.push({
        type: document.getElementById('type').value,
        amount: amount,
        category: document.getElementById('category').value,
        date: new Date().toISOString()
      });

      amtInput.value = '';
      render();
    }

    render();
  </script>
</body>
</html>
