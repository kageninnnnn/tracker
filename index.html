<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Capital</title>
  <style>
    :root {
      --bg: #000000; --surface: #1c1c1e; --surface-hover: #2c2c2e;
      --primary: #0a84ff; --red: #ff453a; --green: #32d74b; --purple: #bf5af2;
      --text: #ffffff; --text-sec: #8e8e93; --border: #38383a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px 80px; }
    
    .hero-card { background: linear-gradient(145deg, #1c1c1e 0%, #252528 100%); border: 1px solid var(--border); border-radius: 24px; padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .hero-label { font-size: 13px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .hero-balance { font-size: 38px; font-weight: 800; color: #fff; margin-bottom: 20px; letter-spacing: -1px; }
    .hero-stats { display: flex; gap: 12px; }
    .stat-box { flex: 1; background: rgba(0,0,0,0.25); border-radius: 16px; padding: 14px; border: 1px solid rgba(255,255,255,0.05); }
    .stat-label { font-size: 12px; color: var(--text-sec); margin-bottom: 4px; font-weight: 500; }
    .stat-val { font-size: 16px; font-weight: 700; }
    .val-exp { color: var(--red); } .val-dep { color: var(--purple); }

    .segmented-control { display: flex; background: var(--surface); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .seg-btn { flex: 1; padding: 10px 0; border: none; background: transparent; color: var(--text-sec); font-size: 14px; font-weight: 600; border-radius: 8px; transition: all 0.2s; }
    .seg-btn.active.exp { background: var(--red); color: #fff; }
    .seg-btn.active.inc { background: var(--green); color: #fff; }
    .seg-btn.active.dep { background: var(--purple); color: #fff; }

    .input-row { display: flex; gap: 12px; margin-bottom: 12px; }
    input, select { width: 100%; background: var(--surface); border: 1px solid transparent; color: var(--text); padding: 16px; border-radius: 16px; font-size: 16px; outline: none; }
    button.submit { width: 100%; padding: 16px; background: var(--text); color: var(--bg); border: none; border-radius: 16px; font-size: 17px; font-weight: 700; margin-top: 4px; margin-bottom: 24px; }
    
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .section-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    #month-filter { width: auto; padding: 8px 12px; font-size: 14px; border-radius: 10px; }

    .day-group { margin-bottom: 16px; }
    .day-header { font-size: 14px; font-weight: 600; color: var(--text-sec); margin-bottom: 10px; padding-left: 4px; }
    .item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 12px 16px; border-radius: 20px; margin-bottom: 8px; }
    .item-left { display: flex; align-items: center; gap: 14px; }
    .item-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-hover); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .item-cat { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
    .item-desc { font-size: 13px; color: var(--text-sec); }
    .item-right { text-align: right; display: flex; align-items: center; }
    .item-amt { font-weight: 700; font-size: 17px; letter-spacing: -0.5px; }
    .amt-exp { color: var(--red); } .amt-inc { color: var(--green); } .amt-dep { color: var(--purple); }
    .del-btn { color: var(--text-sec); background: transparent; border: none; font-size: 22px; padding: 0 0 0 12px; margin-left: 12px; border-left: 1px solid var(--border); }
    
    .data-tools { display: flex; gap: 10px; margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px; }
    .tool-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-sec); font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="hero-card">
    <div class="hero-label">Мой капитал</div>
    <div id="val-balance" class="hero-balance">0 ₸</div>
    <div class="hero-stats">
      <div class="stat-box">
        <div class="stat-label">Расход (выбр. мес)</div>
        <div id="val-month-exp" class="stat-val val-exp">0 ₸</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">В копилке</div>
        <div id="val-deposit" class="stat-val val-dep">0 ₸</div>
      </div>
    </div>
  </div>

  <div>
    <div class="segmented-control">
      <button class="seg-btn active exp" onclick="setType('exp')" id="btn-exp">Расход</button>
      <button class="seg-btn" onclick="setType('inc')" id="btn-inc">Доход</button>
      <button class="seg-btn" onclick="setType('dep')" id="btn-dep">Копилка</button>
    </div>
    <div class="input-row"><input type="number" id="amount" placeholder="Сумма (₸)" inputmode="numeric"></div>
    <div class="input-row"><select id="category"></select></div>
    <div class="input-row"><input type="text" id="note" placeholder="Заметка (необязательно)"></div>
    <button class="submit" onclick="addEntry()">Добавить операцию</button>
  </div>

  <div class="header-row">
    <div class="section-title">История</div>
    <select id="month-filter" onchange="render()"></select>
  </div>
  <div id="list"></div>

  <div class="data-tools">
    <button class="tool-btn" onclick="exportData()">↓ Скачать JSON</button>
    <button class="tool-btn" onclick="document.getElementById('import-file').click()">↑ Загрузить JSON</button>
    <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
  </div>

  <script>
    let entries = JSON.parse(localStorage.getItem('mm_data') || '[]');
    let currentType = 'exp';

    const categories = {
      exp: [{ id: 'Еда / Продукты', icon: '🍔' }, { id: 'Зал / БАДы', icon: '🏋️' }, { id: 'Долги', icon: '🤝' }, { id: 'Вещи / Техника', icon: '🎒' }, { id: 'Транспорт', icon: '🚕' }, { id: 'Хотелки', icon: '🎮' }],
      inc: [{ id: 'Зарплата', icon: '💵' }, { id: 'Перевод', icon: '💳' }, { id: 'Подарок', icon: '🎁' }],
      dep: [{ id: 'Пополнение', icon: '🏦' }, { id: 'Снятие из копилки', icon: '📉' }]
    };

    function setType(type) {
      currentType = type;
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active', 'exp', 'inc', 'dep'));
      document.getElementById(`btn-${type}`).classList.add('active', type);
      document.getElementById('category').innerHTML = categories[type].map(c => `<option value="${c.id}">${c.id}</option>`).join('');
    }

    function updateMonthFilter() {
      const select = document.getElementById('month-filter');
      const months = [...new Set(entries.map(e => e.date.substring(0, 7)))].sort().reverse();
      const current = new Date().toISOString().substring(0, 7);
      if (!months.includes(current)) months.unshift(current);
      
      const currentVal = select.value || current;
      select.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
      select.value = currentVal;
    }

    function render() {
      if(entries.length >= 0) updateMonthFilter();
      const listEl = document.getElementById('list');
      listEl.innerHTML = '';
      
      let totalInc = 0, totalExp = 0, totalDep = 0, periodExp = 0;
      const selectedMonth = document.getElementById('month-filter').value;
      const groups = {};

      entries.forEach(item => {
        const itemMonth = item.date.substring(0, 7);
        if (item.type === 'inc') totalInc += item.amount;
        if (item.type === 'exp') {
          totalExp += item.amount;
          if (itemMonth === selectedMonth) periodExp += item.amount;
        }
        if (item.type === 'dep') {
            if(item.category === 'Снятие из копилки') totalDep -= item.amount;
            else totalDep += item.amount;
        }

        if (itemMonth === selectedMonth) {
          const d = new Date(item.date);
          const dateKey = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
          if (!groups[dateKey]) groups[dateKey] = [];
          groups[dateKey].push(item);
        }
      });

      document.getElementById('val-balance').innerText = (totalInc - totalExp - totalDep).toLocaleString() + ' ₸';
      document.getElementById('val-month-exp').innerText = periodExp.toLocaleString() + ' ₸';
      document.getElementById('val-deposit').innerText = totalDep.toLocaleString() + ' ₸';

      Object.keys(groups).reverse().forEach(date => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'day-group';
        groupDiv.innerHTML = `<div class="day-header">${date}</div>`;
        
        groups[date].slice().reverse().forEach(item => {
          let prefix = '', amtClass = '';
          if (item.type === 'inc' || (item.type === 'dep' && item.category === 'Снятие из копилки')) { prefix = '+'; amtClass = 'amt-inc'; }
          else if (item.type === 'exp') { prefix = '-'; amtClass = 'amt-exp'; }
          else { prefix = '→'; amtClass = 'amt-dep'; }

          const catObj = categories[item.type].find(c => c.id === item.category);
          const icon = catObj ? catObj.icon : '📌';

          const row = document.createElement('div');
          row.className = 'item';
          row.innerHTML = `
            <div class="item-left"><div class="item-icon">${icon}</div><div><div class="item-cat">${item.category}</div>${item.note ? `<div class="item-desc">${item.note}</div>` : ''}</div></div>
            <div class="item-right"><div class="item-amt ${amtClass}">${prefix}${item.amount.toLocaleString()} ₸</div><button class="del-btn" onclick="deleteEntry(${item.id})">×</button></div>
          `;
          groupDiv.appendChild(row);
        });
        listEl.appendChild(groupDiv);
      });
      localStorage.setItem('mm_data', JSON.stringify(entries));
    }

    function addEntry() {
      const amt = parseFloat(document.getElementById('amount').value);
      if (!amt || amt <= 0) return;
      entries.push({ id: Date.now(), type: currentType, amount: amt, category: document.getElementById('category').value, note: document.getElementById('note').value, date: new Date().toISOString() });
      document.getElementById('amount').value = ''; document.getElementById('note').value = '';
      render();
    }

    function deleteEntry(id) { if(confirm('Удалить?')) { entries = entries.filter(e => e.id !== id); render(); } }

    function exportData() {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup_${new Date().toISOString().substring(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try { entries = JSON.parse(event.target.result); render(); alert('База загружена!'); } 
        catch (err) { alert('Ошибка файла'); }
      };
      reader.readAsText(file);
    }

    setType('exp'); render();
  </script>
</body>
</html>
